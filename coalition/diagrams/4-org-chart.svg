<rect width="1600" height="900" fill="#FAF8F5"/>
<text x="80" y="96" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="46" font-weight="600" fill="#26405B" text-anchor="start">Who does what</text>
<text x="80" y="138" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6E6A61" text-anchor="start">A coalition map, not a company chart. Remove any lane and the platform still stands.</text>
<rect x="560" y="190" width="480" height="96" rx="16" fill="#26405B" stroke="none" stroke-width="2"/>
<text x="800" y="228" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="26" font-weight="600" fill="#FAF8F5" text-anchor="middle">Town Square Committee</text>
<text x="800" y="258" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#D4A853" text-anchor="middle">governance, moderation, the revert button</text>
<text x="800" y="278" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#EDE9E0" text-anchor="middle">Tal at launch, designed for three to five</text>
<path d="M 800 286 L 800 336" fill="none" stroke="#26405B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="340" width="480" height="92" rx="16" fill="#FAF8F5" stroke="#26405B" stroke-width="3"/>
<text x="800" y="376" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="24" font-weight="600" fill="#26405B" text-anchor="middle">Core platform</text>
<text x="800" y="404" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="middle">the platform, SDK, review queue  ·  Tal + AI</text>
<line x1="800" y1="432" x2="800" y2="500" stroke="#CFC7B8" stroke-width="2.5"/>
<line x1="215" y1="500" x2="1385" y2="500" stroke="#CFC7B8" stroke-width="2.5"/>
<line x1="215" y1="500" x2="215" y2="548" stroke="#D4A853" stroke-width="2.5"/>
<rect x="40" y="548" width="350" height="170" rx="16" fill="#FAF8F5" stroke="#D4A853" stroke-width="2.5"/>
<rect x="40" y="548" width="350" height="7" fill="#D4A853" rx="3"/>
<text x="215" y="596" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">ATU capstone teams</text>
<text x="215" y="628.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Build creations on the</text>
<text x="215" y="652.65" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">platform, Sept to April.</text>
<text x="215" y="677.3" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Ship through review.</text>
<line x1="605" y1="500" x2="605" y2="548" stroke="#7D9B76" stroke-width="2.5"/>
<rect x="430" y="548" width="350" height="170" rx="16" fill="#FAF8F5" stroke="#7D9B76" stroke-width="2.5"/>
<rect x="430" y="548" width="350" height="7" fill="#7D9B76" rx="3"/>
<text x="605" y="596" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">ATU sociology</text>
<text x="605" y="628.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Dr. Mikles-Schluterman.</text>
<text x="605" y="652.65" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Adoption research and</text>
<text x="605" y="677.3" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">resident needs.</text>
<line x1="995" y1="500" x2="995" y2="548" stroke="#C4714E" stroke-width="2.5"/>
<rect x="820" y="548" width="350" height="170" rx="16" fill="#FAF8F5" stroke="#C4714E" stroke-width="2.5"/>
<rect x="820" y="548" width="350" height="7" fill="#C4714E" rx="3"/>
<text x="995" y="596" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Founding orgs</text>
<text x="995" y="628.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Content, distribution,</text>
<text x="995" y="652.65" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">and the first residents</text>
<text x="995" y="677.3" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">who actually show up.</text>
<line x1="1385" y1="500" x2="1385" y2="548" stroke="#26405B" stroke-width="2.5"/>
<rect x="1210" y="548" width="350" height="170" rx="16" fill="#FAF8F5" stroke="#26405B" stroke-width="2.5"/>
<rect x="1210" y="548" width="350" height="7" fill="#26405B" rx="3"/>
<text x="1385" y="596" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Resident builders</text>
<text x="1385" y="628.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">Anyone in town, via the</text>
<text x="1385" y="652.65" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">builder tooling. Open</text>
<text x="1385" y="677.3" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6A61" text-anchor="middle">by default.</text>
<text x="800" y="762" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="middle">contributor lanes run parallel to core, never beneath it</text>
<rect x="430" y="794" width="740" height="62" rx="14" fill="#EDE9E0" stroke="#CFC7B8" stroke-width="2"/>
<text x="800" y="822" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#C4714E" text-anchor="middle">Connectors</text>
<text x="800" y="844" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Debra Fithen and the ATU Center for Community Engagement &amp; Academic Outreach</text>
</svg>
