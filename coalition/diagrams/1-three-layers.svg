<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-kerning="normal">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#1D1B16"/>
  </marker>
  <marker id="arrow-sage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#7D9B76"/>
  </marker>
  <marker id="arrow-terra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#C4714E"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#6E6A61"/>
  </marker>
  <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#D4A853"/>
  </marker>
  <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#26405B"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#FAF8F5"/>
<text x="80" y="96" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="46" font-weight="600" fill="#26405B" text-anchor="start">Town Square has three layers</text>
<text x="80" y="138" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6E6A61" text-anchor="start">Aggregation and discovery are table stakes. The build layer is the idea.</text>
<rect x="80" y="200" width="1330" height="185" rx="18" fill="#FAF8F5" stroke="#CFC7B8" stroke-width="2"/>
<rect x="80" y="200" width="12" height="185" rx="0" fill="#D4A853" stroke="none" stroke-width="2"/>
<rect x="80" y="200" width="12" height="185" fill="#D4A853"/>
<circle cx="150" cy="252" r="26" fill="#D4A853" stroke="none" stroke-width="2"/>
<text x="150" y="261" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FAF8F5" text-anchor="middle">3</text>
<text x="196" y="262" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="32" font-weight="600" fill="#26405B" text-anchor="start">The build layer</text>
<text x="196" y="304.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">Residents build small apps on the foundation and plug them in.</text>
<text x="196" y="333.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">Town Square does not build them. It is what they stand on,</text>
<text x="196" y="362.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">and how the town finds them.</text>
<text x="1380" y="262" font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" font-weight="500" fill="#D4A853" text-anchor="end">This is the part that is different</text>
<rect x="80" y="407" width="1330" height="185" rx="18" fill="#FAF8F5" stroke="#CFC7B8" stroke-width="2"/>
<rect x="80" y="407" width="12" height="185" rx="0" fill="#7D9B76" stroke="none" stroke-width="2"/>
<rect x="80" y="407" width="12" height="185" fill="#7D9B76"/>
<circle cx="150" cy="459" r="26" fill="#7D9B76" stroke="none" stroke-width="2"/>
<text x="150" y="468" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FAF8F5" text-anchor="middle">2</text>
<text x="196" y="469" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="32" font-weight="600" fill="#26405B" text-anchor="start">Directory and discovery</text>
<text x="196" y="511.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">Businesses, articles, podcasts, organizations. Built to surface</text>
<text x="196" y="540.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">the thing you did not know to look for, not just the thing you</text>
<text x="196" y="569.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">already knew to search.</text>
<text x="1380" y="469" font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" font-weight="500" fill="#7D9B76" text-anchor="end">741 Russellville listings loaded</text>
<rect x="80" y="614" width="1330" height="185" rx="18" fill="#FAF8F5" stroke="#CFC7B8" stroke-width="2"/>
<rect x="80" y="614" width="12" height="185" rx="0" fill="#C4714E" stroke="none" stroke-width="2"/>
<rect x="80" y="614" width="12" height="185" fill="#C4714E"/>
<circle cx="150" cy="666" r="26" fill="#C4714E" stroke="none" stroke-width="2"/>
<text x="150" y="675" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FAF8F5" text-anchor="middle">1</text>
<text x="196" y="676" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="32" font-weight="600" fill="#26405B" text-anchor="start">Aggregation</text>
<text x="196" y="718.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">News, events, and notices for the town, pulled together in one</text>
<text x="196" y="747.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1D1B16" text-anchor="start">place instead of scattered across a dozen sites and feeds.</text>
<text x="1380" y="676" font-family="'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" font-weight="500" fill="#C4714E" text-anchor="end">What is happening</text>
<text x="80" y="862" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="500" fill="#26405B" text-anchor="start" font-style="italic">Value compounds with the number of people building, not the number of people reading.</text>
</svg>
