<rect width="1600" height="900" fill="#FAF8F5"/>
<text x="80" y="96" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="46" font-weight="600" fill="#26405B" text-anchor="start">How a student team ships without ever blocking the platform</text>
<text x="80" y="138" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#6E6A61" text-anchor="start">The academic deadline and the platform's gate are the same event.</text>
<rect x="80" y="208" width="1440" height="118" rx="16" fill="#EDE9E0" stroke="#CFC7B8" stroke-width="2"/>
<text x="112" y="246" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#6E6A61" text-anchor="start" letter-spacing="2.5">CORE PLATFORM</text>
<text x="112" y="288" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#26405B" text-anchor="start">Ships on its own schedule. Never waits on a student team, because creations are sandboxed.</text>
<path d="M 1180 268 L 1470 268" fill="none" stroke="#6E6A61" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow-muted)"/>
<text x="80" y="382" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#D4A853" text-anchor="start" letter-spacing="2.5">STUDENT TEAM</text>
<rect x="80" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#D4A853" stroke-width="2.5"/>
<rect x="80" y="412" width="218" height="7" fill="#D4A853" rx="3"/>
<text x="189.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Brief</text>
<text x="189.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#D4A853" text-anchor="middle">Sept</text>
<text x="189.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Scope agreed</text>
<text x="189.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">with faculty</text>
<path d="M 302 501 L 320 501" fill="none" stroke="#CFC7B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
<rect x="324" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#D4A853" stroke-width="2.5"/>
<rect x="324" y="412" width="218" height="7" fill="#D4A853" rx="3"/>
<text x="433.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Build</text>
<text x="433.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#D4A853" text-anchor="middle">Fall</text>
<text x="433.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Against a frozen</text>
<text x="433.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">SDK, own AI tools</text>
<path d="M 546 501 L 564 501" fill="none" stroke="#CFC7B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
<rect x="568" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#C4714E" stroke-width="2.5"/>
<rect x="568" y="412" width="218" height="7" fill="#C4714E" rx="3"/>
<text x="677.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Prototype</text>
<text x="677.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#C4714E" text-anchor="middle">Dec</text>
<text x="677.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Partner reviews</text>
<text x="677.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">proof of concept</text>
<path d="M 790 501 L 808 501" fill="none" stroke="#CFC7B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
<rect x="812" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#C4714E" stroke-width="2.5"/>
<rect x="812" y="412" width="218" height="7" fill="#C4714E" rx="3"/>
<text x="921.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Develop</text>
<text x="921.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#C4714E" text-anchor="middle">Spring</text>
<text x="921.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Testing and</text>
<text x="921.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">refinement</text>
<path d="M 1034 501 L 1052 501" fill="none" stroke="#CFC7B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
<rect x="1056" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#7D9B76" stroke-width="2.5"/>
<rect x="1056" y="412" width="218" height="7" fill="#7D9B76" rx="3"/>
<text x="1165.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Review queue</text>
<text x="1165.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7D9B76" text-anchor="middle">April</text>
<text x="1165.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">One exact version,</text>
<text x="1165.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">permissions diffed</text>
<path d="M 1278 501 L 1296 501" fill="none" stroke="#CFC7B8" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
<rect x="1300" y="412" width="218" height="178" rx="16" fill="#FAF8F5" stroke="#26405B" stroke-width="2.5"/>
<rect x="1300" y="412" width="218" height="7" fill="#26405B" rx="3"/>
<text x="1409.0" y="458" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#26405B" text-anchor="middle">Live</text>
<text x="1409.0" y="486" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#26405B" text-anchor="middle">April</text>
<text x="1409.0" y="522.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Public showcase.</text>
<text x="1409.0" y="545.2" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6E6A61" text-anchor="middle">Real residents.</text>
<path d="M 1165.0 590 L 1165.0 646" fill="none" stroke="#7D9B76" stroke-width="2.5" marker-end="url(#arrow-sage)"/>
<rect x="866" y="650" width="654" height="132" rx="16" fill="#FAF8F5" stroke="#7D9B76" stroke-width="2.5"/>
<text x="898" y="690" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#7D9B76" text-anchor="start">The gate is the grade</text>
<text x="898" y="722.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="start">Did the team deliver? Did their exact version pass review.</text>
<text x="898" y="748.1" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="start">Binary, dated, and the same artifact faculty grade.</text>
<rect x="80" y="650" width="750" height="132" rx="16" fill="#EDE9E0" stroke="#CFC7B8" stroke-width="2"/>
<text x="112" y="690" font-family="Newsreader, 'Libre Baskerville', Georgia, serif" font-size="22" font-weight="600" fill="#C4714E" text-anchor="start">If a team stalls</text>
<text x="112" y="722.0" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="start">Nothing happens to the platform. A creation that never ships</text>
<text x="112" y="748.1" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6E6A61" text-anchor="start">is a creation that never shipped. That is an architectural property.</text>
<text x="80" y="838" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#26405B" text-anchor="start" font-style="italic">Students and faculty own nothing after April. Every project here runs on infrastructure that is already maintained, so nothing is orphaned.</text>
</svg>
